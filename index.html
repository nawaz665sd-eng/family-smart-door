
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة العائلة الذكية</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#04070d;color:#e5fbff;
 font-family:Arial,Tahoma,sans-serif;
 min-height:100vh
}
header{
 text-align:center;padding:20px;
 background:#081522;
 border-bottom:1px solid #1c6375
}
h1{margin:0;color:#2be7ff;font-size:24px}
header p{color:#86aeb7;font-size:12px}
nav{
 display:flex;justify-content:center;gap:8px;
 padding:12px;background:#04070d;
 position:sticky;top:0;z-index:10
}
button{
 padding:11px 15px;border-radius:10px;
 border:1px solid #216579;
 background:#0b1a28;color:white;
 font-weight:bold
}
button.active,.primary{
 background:#08758a;border-color:#2be7ff
}
main{max-width:850px;margin:auto;padding:15px}
.page{display:none}
.page.active{display:block}
.card{
 background:#091421;border:1px solid #194858;
 border-radius:18px;padding:18px;margin-bottom:18px
}
h2{color:#2be7ff}
input[type=text]{
 width:100%;padding:13px;margin:7px 0 14px;
 border-radius:10px;border:1px solid #216579;
 background:#050c14;color:white
}
input[type=file]{width:100%;margin:8px 0 15px}
video{
 width:100%;max-width:520px;
 display:block;margin:auto;
 border-radius:15px;
 background:#000;
 transform:scaleX(-1)
}
.actions{
 display:flex;flex-wrap:wrap;gap:8px;
 margin-top:14px
}
.status{
 margin-top:14px;padding:14px;
 text-align:center;border-radius:12px;
 background:#050d15;border:1px solid #194858
}
.good{color:#3dffb0}
.warn{color:#ffb020}
.bad{color:#ff5470}
.member{
 display:flex;align-items:center;gap:12px;
 padding:12px;margin:8px 0;
 background:#050d15;border:1px solid #194858;
 border-radius:12px
}
.member img{
 width:65px;height:65px;
 object-fit:cover;border-radius:50%;
 border:2px solid #2be7ff
}
.member-info{flex:1}
.member-info b{display:block;font-size:17px}
.member-info small{color:#789da6}
.delete{background:#632536;border-color:#ff5470}
#preview{
 display:none;width:90px;height:90px;
 object-fit:cover;border-radius:50%;
 border:2px solid #2be7ff
}
.small{color:#789da6;font-size:12px;line-height:1.8}
</style>
</head>

<body>

<header>
<h1>👁️ بوابة العائلة الذكية</h1>
<p>SMART FAMILY GATE · FACE ID</p>
</header>

<nav>
<button class="tab active" data-page="door">🔔 الجرس الذكي</button>
<button class="tab" data-page="family">👨‍👩‍👧 أفراد العائلة</button>
</nav>

<main>

<section id="door" class="page active">

<div class="card">

<h2>🔐 التعرف على الشخص</h2>

<video id="camera" autoplay muted playsinline></video>

<div class="actions">
<button id="start" class="primary">📷 تشغيل الكاميرا</button>
<button id="stop">⏹ إيقاف</button>
<button id="scan">🔎 التعرف</button>
</div>

<div id="status" class="status">
اضغط «تشغيل الكاميرا» للبدء.
</div>

<p class="small">
إذا كان الشخص مسجلًا في أفراد العائلة سيظهر اسمه.
إذا لم يكن معروفًا سيظهر تنبيه.
</p>

</div>

</section>


<section id="family" class="page">

<div class="card">

<h2>👨‍👩‍👧 إضافة فرد من العائلة</h2>

<label>اسم الشخص</label>

<input
 id="personName"
 type="text"
 placeholder="مثال: محمد"
/>

<label>اختر صورة واضحة للوجه</label>

<input
 id="personPhoto"
 type="file"
 accept="image/*"
/>

<img id="preview">

<div class="actions">
<button id="save" class="primary">
💾 حفظ الفرد
</button>
</div>

<p class="small">
استعمل صورة يظهر فيها الوجه بوضوح ومن الأمام.
</p>

</div>


<div class="card">

<h2>📋 أفراد العائلة</h2>

<div id="members"></div>

</div>

</section>

</main>


<script>

const MODEL_URL =
"https://justadudewhohacks.github.io/face-api.js/models";

const STORAGE_KEY="family_face_members";

let cameraStream=null;
let selectedPhoto=null;
let modelsReady=false;


/* ---------- التنقل ---------- */

document.querySelectorAll(".tab").forEach(button=>{

 button.onclick=()=>{

  document.querySelectorAll(".tab")
   .forEach(x=>x.classList.remove("active"));

  document.querySelectorAll(".page")
   .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  document
   .getElementById(button.dataset.page)
   .classList.add("active");
 };

});


/* ---------- التخزين ---------- */

function getMembers(){

 try{
  return JSON.parse(
   localStorage.getItem(STORAGE_KEY)||"[]"
  );
 }catch(e){
  return [];
 }

}


function saveMembers(data){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(data)
 );

}


/* ---------- عرض أفراد العائلة ---------- */

function renderMembers(){

 const box=document.getElementById("members");

 const members=getMembers();

 box.innerHTML="";

 if(!members.length){

  box.innerHTML=
   '<p class="small">لم تتم إضافة أي فرد بعد.</p>';

  return;
 }


 members.forEach((member,index)=>{

  const div=document.createElement("div");

  div.className="member";

  div.innerHTML=`

   <img src="${member.photo}">

   <div class="member-info">
    <b>${escapeHTML(member.name)}</b>
    <small>مسجل في هذا الجهاز</small>
   </div>

   <button class="delete">
    حذف
   </button>

  `;

  div.querySelector("button").onclick=()=>{

   if(confirm("هل تريد حذف "+member.name+"؟")){

    const list=getMembers();

    list.splice(index,1);

    saveMembers(list);

    renderMembers();

   }

  };

  box.appendChild(div);

 });

}


function escapeHTML(text){

 return String(text).replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[c])
 );

}


/* ---------- اختيار الصورة ---------- */

document
.getElementById("personPhoto")
.onchange=event=>{

 const file=event.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

  selectedPhoto=reader.result;

  const preview=document.getElementById("preview");

  preview.src=selectedPhoto;

  preview.style.display="block";

 };

 reader.readAsDataURL(file);

};


/* ---------- تحميل النماذج ---------- */

async function loadModels(){

 setStatus(
  "جاري تحميل نظام التعرف على الوجه...",
  "warn"
 );

 try{

  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);

  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

  modelsReady=true;

  setStatus(
   "نظام التعرف جاهز ✅",
   "good"
  );

 }catch(error){

  console.error(error);

  setStatus(
   "تعذر تحميل نماذج التعرف. تحقق من الإنترنت ثم أعد فتح الصفحة.",
   "bad"
  );

 }

}


/* ---------- حفظ فرد ---------- */

document
.getElementById("save")
.onclick=async()=>{

 const name=
  document.getElementById("personName")
  .value.trim();

 if(!name){

  alert("اكتب اسم الشخص.");

  return;

 }

 if(!selectedPhoto){

  alert("اختر صورة للشخص.");

  return;

 }

 if(!modelsReady){

  alert("انتظر حتى يكتمل تحميل نظام التعرف.");

  return;

 }


 setStatus(
  "جاري تحليل صورة "+name+"...",
  "warn"
 );


 try{

  const image=
   await faceapi.fetchImage(selectedPhoto);

  const detection=
   await faceapi
   .detectSingleFace(
    image,
    new faceapi.TinyFaceDetectorOptions()
   )
   .withFaceLandmarks()
   .withFaceDescriptor();


  if(!detection){

   alert(
    "لم أجد وجهًا واضحًا في الصورة.\n"+
    "اختر صورة يظهر فيها الوجه من الأمام."
   );

   setStatus(
    "لم يتم العثور على وجه.",
    "bad"
   );

   return;

  }


  const descriptor=
   Array.from(detection.descriptor);


  const members=getMembers();

  members.push({

   name:name,

   photo:selectedPhoto,

   descriptor:descriptor

  });


  saveMembers(members);

  renderMembers();


  document.getElementById("personName").value="";

  document.getElementById("personPhoto").value="";

  document.getElementById("preview").style.display="none";

  selectedPhoto=null;


  setStatus(
   "تم تسجيل "+name+" بنجاح ✅",
   "good"
  );


 }catch(error){

  console.error(error);

  alert("حدث خطأ أثناء تحليل الصورة.");

 }

};


/* ---------- الكاميرا ---------- */

document
.getElementById("start")
.onclick=async()=>{

 try{

  if(!navigator.mediaDevices){

   throw new Error("Camera API unavailable");

  }


  cameraStream=
   await navigator.mediaDevices.getUserMedia({

    video:{
     facingMode:"user",
     width:{ideal:1280},
     height:{ideal:720}
    },

    audio:false

   });


  document.getElementById("camera")
   .srcObject=cameraStream;


  setStatus(
   "الكاميرا تعمل الآن 📷",
   "good"
  );


 }catch(error){

  console.error(error);

  setStatus(
   "لم يتم تشغيل الكاميرا. اسمح للمتصفح باستخدام الكاميرا.",
   "bad"
  );

 }

};


/* ---------- إيقاف الكاميرا ---------- */

document
.getElementById("stop")
.onclick=()=>{

 if(cameraStream){

  cameraStream
   .getTracks()
   .forEach(track=>track.stop());

  cameraStream=null;

 }

 document.getElementById("camera")
  .srcObject=null;

 setStatus(
  "تم إيقاف الكاميرا.",
  "warn"
 );

};


/* ---------- التعرف ---------- */

document
.getElementById("scan")
.onclick=async()=>{

 if(!modelsReady){

  setStatus(
   "نظام التعرف لم يجهز بعد.",
   "warn"
  );

  return;

 }


 if(!cameraStream){

  setStatus(
   "شغل الكاميرا أولًا.",
   "warn"
  );

  return;

 }


 const members=getMembers();


 if(!members.length){

  setStatus(
   "أضف أفراد العائلة أولًا.",
   "warn"
  );

  return;

 }


 setStatus(
  "جاري فحص الوجه... 🔎",
  "warn"
 );


 try{

  const video=document.getElementById("camera");


  const detection=
   await faceapi
   .detectSingleFace(
    video,
    new faceapi.TinyFaceDetectorOptions()
   )
   .withFaceLandmarks()
   .withFaceDescriptor();


  if(!detection){

   setStatus(
    "لم يتم العثور على وجه واضح.",
    "warn"
   );

   return;

  }


  let bestName=null;

  let bestDistance=Infinity;


  members.forEach(member=>{

   if(!member.descriptor)return;


   const distance=
    faceapi.euclideanDistance(
     detection.descriptor,
     new Float32Array(member.descriptor)
    );


   if(distance<bestDistance){

    bestDistance=distance;

    bestName=member.name;

   }

  });


  /*
   قيمة أقل من 0.50 تعتبر تطابقًا جيدًا.
   نستعمل 0.50 كبداية محافظة.
  */


  if(bestName && bestDistance<0.50){

   setStatus(
    "🟢 مرحبًا "+escapeHTML(bestName)+" — تم التعرف عليك",
    "good"
   );

  }else{

   setStatus(
    "🔴 شخص غير معروف — تم رفض التعرف",
    "bad"
   );

  }


 }catch(error){

  console.error(error);

  setStatus(
   "حدث خطأ أثناء فحص الوجه.",
   "bad"
  );

 }

};


/* ---------- الحالة ---------- */

function setStatus(text,type){

 const box=document.getElementById("status");

 box.className="status "+type;

 box.innerHTML=text;

}


/* ---------- البداية ---------- */

renderMembers();

loadModels();

</script>

</body>
</html>
