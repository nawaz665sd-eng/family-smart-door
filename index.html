<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة العائلة الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  :root{
    --void:#04060c;
    --panel:#0a1220;
    --panel-2:#0e1a2e;
    --line: rgba(34,226,255,0.18);
    --cyan:#2be7ff;
    --cyan-dim:#0d5d6e;
    --violet:#a06bff;
    --amber:#ffb020;
    --green:#3dffb0;
    --red:#ff5470;
    --text:#dff7ff;
    --text-dim:#7fa3ad;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #0c2233 0%, var(--void) 55%) fixed;
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 46px 46px;
    opacity:.25;
    pointer-events:none;
    mask-image: radial-gradient(ellipse at 50% 20%, black, transparent 75%);
  }
  .noise-scan{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 34px;
    position:relative; z-index:5;
    border-bottom:1px solid var(--line);
    backdrop-filter: blur(6px);
    flex-wrap:wrap; gap:14px;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:40px;height:40px; border-radius:50%;
    border:1.5px solid var(--cyan);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 18px rgba(43,231,255,.55), inset 0 0 10px rgba(43,231,255,.4);
    animation: pulse-ring 3s ease-in-out infinite;
    font-size:18px;
  }
  @keyframes pulse-ring{
    0%,100%{ box-shadow: 0 0 12px rgba(43,231,255,.4), inset 0 0 8px rgba(43,231,255,.3);}
    50%{ box-shadow: 0 0 26px rgba(43,231,255,.75), inset 0 0 14px rgba(43,231,255,.5);}
  }
  .brand h1{
    font-size:19px; font-weight:800; letter-spacing:.5px;
    text-shadow: 0 0 14px rgba(43,231,255,.5);
  }
  .brand span{ display:block; font-size:11px; color:var(--text-dim); font-weight:400; letter-spacing:2px; font-family:'Share Tech Mono', monospace; }

  nav{ display:flex; gap:6px; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:14px; padding:4px; }
  nav button{
    background:transparent; border:none; color:var(--text-dim);
    font-family:'Tajawal'; font-weight:700; font-size:14.5px;
    padding:10px 20px; border-radius:10px; cursor:pointer;
    transition: all .25s ease;
  }
  nav button.active{
    background: linear-gradient(180deg, rgba(43,231,255,.18), rgba(43,231,255,.05));
    color:var(--cyan); box-shadow: inset 0 0 0 1px rgba(43,231,255,.4), 0 0 16px rgba(43,231,255,.25);
  }
  nav button:hover:not(.active){ color:var(--text); }

  main{ max-width:1180px; margin:0 auto; padding: 40px 26px 90px; position:relative; z-index:2;}
  .view{ display:none; animation: fade-in .5s ease; }
  .view.active{ display:block; }
  @keyframes fade-in{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- DOORBELL VIEW ---------- */
  .doorbell-grid{
    display:grid; grid-template-columns: 1.15fr .85fr; gap:28px;
  }
  @media (max-width: 880px){ .doorbell-grid{ grid-template-columns: 1fr; } }

  .stage-card{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:22px;
    padding: 30px 24px 26px;
    position:relative; overflow:hidden;
    min-height: 560px; display:flex; flex-direction:column; align-items:center;
  }
  .stage-label{
    align-self:flex-start;
    font-family:'Share Tech Mono', monospace; font-size:11.5px; letter-spacing:3px;
    color:var(--cyan-dim); text-transform:uppercase; margin-bottom:6px;
  }
  .stage-title{ align-self:flex-start; font-size:20px; font-weight:800; margin-bottom:22px; }

  .holo-stage{
    perspective: 1300px;
    width:280px; height:280px;
    display:flex; align-items:center; justify-content:center;
    position:relative; margin-top:10px;
  }
  .holo-floor{
    position:absolute; bottom:-18px; left:50%; transform:translateX(-50%) rotateX(70deg);
    width:260px; height:260px; border-radius:50%;
    background: repeating-conic-gradient(rgba(43,231,255,.16) 0deg 2deg, transparent 2deg 10deg);
    filter: blur(.2px);
    opacity:.8;
  }
  .holo-ring{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    border-radius:50%; border:1.5px solid var(--cyan);
    opacity:0; animation: ring-pulse 2.4s ease-out infinite;
  }
  .holo-ring.r1{ width:70px; height:22px; animation-delay:0s; }
  .holo-ring.r2{ width:70px; height:22px; animation-delay:.8s; }
  .holo-ring.r3{ width:70px; height:22px; animation-delay:1.6s; }
  @keyframes ring-pulse{
    0%{ width:60px; height:18px; opacity:.9; }
    100%{ width:230px; height:70px; opacity:0; }
  }
  .holo-beam{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    width:150px; height:230px;
    background: linear-gradient(to top, rgba(43,231,255,.35), rgba(43,231,255,.05) 60%, transparent);
    clip-path: polygon(38% 100%, 62% 100%, 100% 0%, 0% 0%);
    opacity:.55; animation: beam-flicker 3.4s ease-in-out infinite;
  }
  @keyframes beam-flicker{
    0%,100%{ opacity:.5; } 45%{ opacity:.32; } 47%{ opacity:.6; } 60%{ opacity:.5;} 92%{opacity:.25;}
  }

  .holo-head-orbit{
    width:200px; height:240px; transform-style:preserve-3d;
    animation: spin-head 7s linear infinite;
    position:relative; margin-bottom: 30px;
  }
  .holo-head-orbit.paused{ animation-play-state: paused; }
  @keyframes spin-head{ from{ transform: rotateY(0deg);} to{ transform: rotateY(360deg);} }

  /* No frame, no disc, no border — the head itself fades to transparent at the edges
     so it reads as a free-floating hologram instead of a photo in a circle. */
  .holo-face{
    position:absolute; inset:0; overflow:visible;
    background:transparent; border:none;
    -webkit-mask-image: radial-gradient(ellipse 66% 78% at 50% 42%, #000 62%, transparent 92%);
            mask-image: radial-gradient(ellipse 66% 78% at 50% 42%, #000 62%, transparent 92%);
    filter: drop-shadow(0 0 14px rgba(43,231,255,.85)) drop-shadow(0 0 34px rgba(43,231,255,.45));
  }
  .holo-face img, .holo-face .silhouette{
    width:100%; height:100%; object-fit:cover; display:block;
    filter: brightness(1.18) contrast(1.14) saturate(1.05);
  }
  .holo-face img::selection{ background:transparent; }
  .holo-face .silhouette{
    display:flex; align-items:center; justify-content:center; font-size:80px; color:var(--cyan); opacity:.7;
  }
  .holo-face .tint{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(43,231,255,.28), rgba(43,231,255,.06) 55%, rgba(120,90,255,.18));
    mix-blend-mode: screen; opacity:.55; pointer-events:none;
  }
  .holo-face .grid-overlay{
    position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(to bottom, rgba(43,231,255,.15) 0px, transparent 2px, transparent 4px);
    animation: scan-move 2.2s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes scan-move{ from{ background-position-y:0;} to{ background-position-y:80px;} }
  .holo-face .sweep{
    position:absolute; left:0; right:0; height:14px; pointer-events:none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
    animation: scan-sweep 2.6s ease-in-out infinite; opacity:.75; z-index:3;
  }
  @keyframes scan-sweep{ 0%{ top:0;} 50%{ top:92%;} 100%{ top:0;} }

  .status-box{ text-align:center; margin-top:6px; }
  .status-title{
    font-size: 24px; font-weight:900; letter-spacing:.3px; min-height:34px;
    transition: color .3s ease, text-shadow .3s ease;
  }
  .status-title.idle{ color:var(--text-dim); }
  .status-title.scanning{ color:var(--cyan); text-shadow: 0 0 16px rgba(43,231,255,.6); }
  .status-title.known{ color:var(--green); text-shadow: 0 0 16px rgba(61,255,176,.6); }
  .status-title.unknown{ color:var(--amber); text-shadow: 0 0 16px rgba(255,176,32,.5); }
  .status-sub{ font-size:13.5px; color:var(--text-dim); margin-top:6px; font-family:'Share Tech Mono', monospace; letter-spacing:.5px;}

  .ai-badge{
    font-family:'Share Tech Mono', monospace; font-size:10.5px; letter-spacing:1px;
    padding:5px 11px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim);
    display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; align-self:flex-start;
  }
  .ai-badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--text-dim); }
  .ai-badge.loading .dot{ background:var(--amber); animation: blink 1s infinite; }
  .ai-badge.ready .dot{ background:var(--green); box-shadow:0 0 6px var(--green); }
  .ai-badge.ready{ color:var(--green); border-color: rgba(61,255,176,.35); }

  .mode-switch{
    display:flex; gap:6px; background:rgba(255,255,255,.03); border:1px solid var(--line);
    border-radius:12px; padding:4px; width:100%; max-width:380px; margin-bottom:2px;
  }
  .mode-switch button{
    flex:1; background:transparent; border:none; color:var(--text-dim); font-family:'Tajawal'; font-weight:700;
    font-size:13px; padding:9px 8px; border-radius:9px; cursor:pointer; transition:.2s;
  }
  .mode-switch button.active{
    background: linear-gradient(180deg, rgba(43,231,255,.18), rgba(43,231,255,.05));
    color:var(--cyan); box-shadow: inset 0 0 0 1px rgba(43,231,255,.4);
  }

  .camera-preview{
    width:100%; max-width:380px; border-radius:14px; overflow:hidden; border:1px solid var(--line);
    background:#000; position:relative; display:none; aspect-ratio: 4/3;
  }
  .camera-preview.on{ display:block; }
  .camera-preview video{ width:100%; height:100%; object-fit:cover; display:block; transform:scaleX(-1); }
  .camera-preview.back-cam video{ transform:scaleX(1); }
  .camera-preview .flip-btn{
    position:absolute; bottom:8px; left:8px; background:rgba(4,6,12,.65); border:1px solid var(--line);
    color:var(--text); width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:15px;
  }
  .camera-preview .cam-frame{
    position:absolute; inset:14%; border:1.5px dashed rgba(43,231,255,.55); border-radius:14px; pointer-events:none;
  }
  .cam-error{
    font-size:12.5px; color:var(--amber); background:rgba(255,176,32,.08); border:1px solid rgba(255,176,32,.3);
    border-radius:10px; padding:10px 12px; display:none; line-height:1.8;
  }
  .cam-error.show{ display:block; }

  .stage-controls{
    margin-top: 18px; width:100%; max-width:380px;
    display:flex; flex-direction:column; gap:10px;
  }
  select, input, textarea{
    width:100%; background: rgba(255,255,255,.04); border:1px solid var(--line);
    color:var(--text); padding:11px 14px; border-radius:11px; font-family:'Tajawal'; font-size:14.5px;
    outline:none; transition: border-color .2s;
  }
  select:focus, input:focus, textarea:focus{ border-color: var(--cyan); }
  .ring-btn{
    margin-top:4px; border:none; cursor:pointer;
    background: linear-gradient(180deg, rgba(43,231,255,.9), rgba(15,150,180,.9));
    color:#03181d; font-weight:900; font-size:16px; letter-spacing:.5px;
    padding:14px; border-radius:13px;
    box-shadow: 0 0 24px rgba(43,231,255,.4);
    transition: transform .15s ease, box-shadow .15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .ring-btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 28px rgba(43,231,255,.55); }
  .ring-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

  /* ---------- Notify Panel ---------- */
  .notify-card{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:22px; padding:24px;
    display:flex; flex-direction:column; gap:16px; min-height:560px;
  }
  .notify-head{ display:flex; align-items:center; justify-content:space-between; }
  .notify-head h3{ font-size:16px; font-weight:800; }
  .live-dot{ width:8px; height:8px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red); display:inline-block; margin-left:6px; animation: blink 1.2s infinite; }
  @keyframes blink{ 50%{ opacity:.2; } }

  .phone-mock{
    flex:1; background:#050b12; border:1px solid var(--line); border-radius:18px;
    padding:18px; display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden;
  }
  .phone-mock .notch{ width:70px; height:6px; background:#111c28; border-radius:6px; margin:0 auto; }
  .call-empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-dim); text-align:center; padding: 0 20px;}
  .call-empty .icon{ font-size:38px; opacity:.5; }
  .call-active{ display:flex; flex-direction:column; align-items:center; gap:14px; flex:1; justify-content:center; padding: 10px 14px; }
  .visitor-photo{
    width:110px; height:110px; border-radius:22px; overflow:hidden; object-fit:cover;
    border:2px solid var(--cyan); box-shadow:0 0 22px rgba(43,231,255,.4);
    display:flex; align-items:center; justify-content:center; background:#0d1826; font-size:44px;
  }
  .visitor-photo img{ width:100%; height:100%; object-fit:cover; }
  .visitor-name{ font-size:18px; font-weight:800; }
  .visitor-tag{ font-size:12.5px; padding:4px 12px; border-radius:20px; font-weight:700; font-family:'Share Tech Mono', monospace; letter-spacing:1px; }
  .visitor-tag.known{ background:rgba(61,255,176,.14); color:var(--green); border:1px solid rgba(61,255,176,.4); }
  .visitor-tag.unknown{ background:rgba(255,176,32,.14); color:var(--amber); border:1px solid rgba(255,176,32,.4); }

  .call-log{
    width:100%; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; font-size:13px; color:var(--text-dim); height:78px; overflow-y:auto; font-family:'Share Tech Mono', monospace;
  }
  .call-log div{ margin-bottom:4px; }
  .talk-row{ display:flex; gap:8px; width:100%; }
  .talk-row input{ flex:1; }
  .icon-btn{
    border:none; border-radius:11px; width:44px; height:44px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    background: rgba(43,231,255,.14); color:var(--cyan); border:1px solid rgba(43,231,255,.4);
  }
  .end-btn{
    border:none; background: linear-gradient(180deg, #ff5470, #b3253f); color:#fff; font-weight:800;
    padding:12px; border-radius:12px; cursor:pointer; width:100%; letter-spacing:.4px;
  }

  /* ---------- FAMILY VIEW ---------- */
  .family-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:18px; margin-bottom:30px; }
  .member-card{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:18px; padding:20px 16px; text-align:center; position:relative;
  }
  .member-photo{
    width:78px; height:78px; border-radius:50%; margin:0 auto 12px; overflow:hidden;
    border:1.5px solid var(--cyan); box-shadow:0 0 14px rgba(43,231,255,.35);
    display:flex; align-items:center; justify-content:center; background:#0d1826; font-size:30px; color:var(--cyan);
  }
  .member-photo img{ width:100%; height:100%; object-fit:cover; }
  .member-name{ font-weight:800; font-size:15.5px; margin-bottom:3px; }
  .member-dob{ font-size:12px; color:var(--text-dim); font-family:'Share Tech Mono', monospace; }
  .del-btn{
    position:absolute; top:10px; left:10px; background:rgba(255,84,112,.12); border:1px solid rgba(255,84,112,.4);
    color:var(--red); width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:13px; line-height:1;
  }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); border:1px dashed var(--line); border-radius:18px; }

  .add-card{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:20px; padding:24px; max-width:460px;
  }
  .add-card h3{ font-size:16px; font-weight:800; margin-bottom:16px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-family:'Share Tech Mono', monospace; letter-spacing:.5px; }
  .photo-upload{
    display:flex; align-items:center; gap:12px;
  }
  .photo-preview{
    width:60px; height:60px; border-radius:50%; overflow:hidden; border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:22px; flex-shrink:0; background:rgba(255,255,255,.03);
  }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .file-btn{
    background:rgba(43,231,255,.1); border:1px solid rgba(43,231,255,.4); color:var(--cyan);
    padding:9px 14px; border-radius:10px; font-size:13px; cursor:pointer; font-weight:700;
  }
  .save-btn{
    margin-top:6px; width:100%; border:none; cursor:pointer; background:linear-gradient(180deg, var(--cyan), var(--cyan-dim));
    color:#03181d; font-weight:900; padding:13px; border-radius:12px; font-size:14.5px;
  }
  .hint{ font-size:11.5px; color:var(--text-dim); margin-top:14px; line-height:1.9; border-top:1px solid var(--line); padding-top:14px;}
  .toast{
    position:fixed; bottom:24px; right:50%; transform:translateX(50%);
    background: rgba(10,18,32,.95); border:1px solid var(--cyan); color:var(--text);
    padding:12px 22px; border-radius:12px; font-size:13.5px; z-index:100; box-shadow:0 0 24px rgba(43,231,255,.3);
    opacity:0; pointer-events:none; transition: opacity .3s, transform .3s;
  }
  .toast.show{ opacity:1; transform:translateX(50%) translateY(-6px); }
</style>
</head>
<body>

<div class="noise-scan"></div>

<header>
  <div class="brand">
    <div class="brand-mark">👁️</div>
    <div>
      <h1>بوابة العائلة الذكية</h1>
      <span>SMART FAMILY GATE · HOLO-ID SYSTEM</span>
    </div>
  </div>
  <nav>
    <button class="active" data-view="doorbell">الجرس الذكي</button>
    <button data-view="family">أفراد العائلة</button>
  </nav>
</header>

<main>

  <!-- ===================== DOORBELL VIEW ===================== -->
  <section class="view active" id="view-doorbell">
    <div class="doorbell-grid">

      <div class="stage-card">
        <div class="stage-label">Holographic Identity Scanner</div>
        <div class="stage-title">من يقف عند الباب؟</div>
        <div class="ai-badge loading" id="aiBadge"><span class="dot"></span><span id="aiBadgeText">جاري تحميل نموذج التعرف على الوجوه...</span></div>

        <div class="holo-stage">
          <div class="holo-beam"></div>
          <div class="holo-ring r1"></div>
          <div class="holo-ring r2"></div>
          <div class="holo-ring r3"></div>
          <div class="holo-head-orbit paused" id="holoOrbit">
            <div class="holo-face" id="holoFace">
              <div class="silhouette">👤</div>
              <div class="tint"></div>
              <div class="grid-overlay"></div>
              <div class="sweep"></div>
            </div>
          </div>
        </div>

        <div class="status-box">
          <div class="status-title idle" id="statusTitle">بانتظار ضغط الجرس...</div>
          <div class="status-sub" id="statusSub">اختر شخصاً لمحاكاة وقوفه أمام الباب ثم اضغط الجرس</div>
        </div>

        <div class="mode-switch">
          <button class="active" id="modeManualBtn"
